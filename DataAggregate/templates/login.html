<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); width: 360px; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #333; }
    label { display: block; font-size: .85rem; color: #555; margin-bottom: .3rem; }
    input { width: 100%; padding: .6rem .8rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #4a6cf7; }
    button { width: 100%; padding: .7rem; background: #4a6cf7; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #3a5ce5; }
    .error { color: #c0392b; font-size: .85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    {% if form.errors %}
      <p class="error">Invalid username or password.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      {{ form.username }}
      <label for="id_password">Password</label>
      {{ form.password }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
